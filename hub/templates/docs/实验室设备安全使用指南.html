<div class="doc-snippet">
  <h3>关键要点</h3>
  <ul>
    <li>使用前检查：确认电源线、插头与设备外观无损，匹配额定电压/电流。</li>
    <li>使用中注意：不超负荷使用排插，避免潮湿环境与易燃物靠近设备。</li>
    <li>电池管理：充电时有人值守，充电放置在耐火托盘或通风处，发现异常立即处理。</li>
    <li>离开前操作：离开或下班前务必关闭船舶电池主开关并断开排插电源，规范存放电池。</li>
  </ul>
