  <h3>关键要点</h3>
  <ul>
    <li>负载与配电：不要在单一路由或排插上并联过多高功率设备，优先使用带漏电/过载保护的排插。</li>
    <li>电池充电与存放：与易燃物隔离，充电区域应有耐火托盘与通风。</li>
    <li>灭火与疏散：配备适当灭火器（干粉/CO2），熟悉断电与疏散流程。</li>
    <li>下班检查：下班或离开前切断船舶电池与大功率电源主开关，拔掉非必要插头。</li>
  </ul>
